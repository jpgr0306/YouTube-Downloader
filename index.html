<!doctype html>
<html lang="pt-br">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baixar do YouTube</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 12px }
  input { width: 55%; padding: 8px } select, button { padding: 8px }
  pre { background: #111; color: #0f0; padding: 12px; height: 400px; overflow: auto; white-space: pre-wrap }
</style>
<h2>Baixar video do YouTube</h2>
<input id="url" placeholder="https://www.youtube.com/watch?v=...">
<select id="qual">
  <option value="melhor">Melhor qualidade</option>
  <option value="2160">Ate 4K (2160p)</option>
  <option value="1440">Ate 1440p</option>
  <option value="1080">Ate 1080p</option>
  <option value="720">Ate 720p</option>
  <option value="480">Ate 480p</option>
  <option value="360">Ate 360p</option>
  <option value="mp3">So audio (MP3)</option>
  <option value="m4a">So audio (M4A)</option>
</select>
<button id="btn">Baixar</button>
<p style="color:#666;font-size:13px">Se o video nao tiver a qualidade escolhida, baixa a melhor abaixo dela.</p>
<pre id="out"></pre>
<script>
const out = document.getElementById("out"), btn = document.getElementById("btn");
// progresso ("[download]  42.0% ...") fica sempre numa linha so, que vai sendo atualizada;
// ate 100 linhas mostra tudo; dali pra frente so troca a ultima linha
let linhas = [];
const progresso = (t) => /^\[download\]\s+[\d.]+%|^Recebendo arquivo/.test(t || "");
const log = (t) => {
  if (progresso(t) && progresso(linhas[linhas.length - 1])) linhas[linhas.length - 1] = t;
  else if (linhas.length < 100) linhas.push(t); else linhas[99] = t;
  out.textContent = linhas.join("\n") + "\n"; out.scrollTop = 1e9;
};

btn.onclick = async () => {
  btn.disabled = true; linhas = []; out.textContent = "";
  let nome = "video.mp4", partes = [], resto = "", recebido = 0;
  if (location.protocol === "file:") {
    log("Erro: abra pelo endereco da Vercel (https://...vercel.app), nao pelo arquivo index.html.");
    btn.disabled = false; return;
  }
  log("Chamando o servidor... (pode levar alguns segundos)");
  try {
    const r = await fetch("/api/baixar?url=" + encodeURIComponent(document.getElementById("url").value)
                          + "&q=" + document.getElementById("qual").value);
    if (!r.ok) {
      log("Erro do servidor: HTTP " + r.status);
      log((await r.text()).slice(0, 1500));
      btn.disabled = false; return;
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { done, value } = await rd.read();
      if (done) break;
      const chegou = (resto + dec.decode(value, { stream: true })).split("\n");
      resto = chegou.pop();
      for (const l of chegou) {
        const tipo = l.slice(0, 2), dado = l.slice(2);
        if (tipo === "L:") log(dado);
        else if (tipo === "F:") nome = dado;
        else if (tipo === "B:") {
          const bin = atob(dado), bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          partes.push(bytes); recebido += bytes.length;
          log("Recebendo arquivo... " + (recebido / 1048576).toFixed(1) + " MB");
        } else if (tipo === "E:") {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob(partes, { type: "application/octet-stream" }));
          a.download = nome; a.click();
          log("Download concluido: " + nome);
        }
      }
    }
  } catch (e) {
    log("Erro: " + e);
    log("A conexao caiu. Na Vercel isso costuma ser a funcao travando ou passando do tempo limite: veja em Vercel > Logs.");
  }
  btn.disabled = false;
};
</script>
</html>
